[project]
name = "sciplots"
version = "0.1.0"
description = "Simple matplotlib plotting utilities with automatic twin axis and clean styling"
authors = [
    {name = "Romain Simon", email = "romainljsimon@gmail.com"}
]
readme = "README.md"
keywords = ["plotting", "matplotlib", "visualization", "utilities"]
requires-python = ">=3.11"
dependencies = [
    "matplotlib",
    "numpy"
]
license = "GPL-3.0-only"
license-files = [
    "LICENSE",
]

[project.urls]
repository = "https://github.com/romainljsimon/sciplots/"

[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[dependency-groups]
dev = [
    "zensical>=0.0.67",
    "pytest>=9.0",
    "mkdocstrings[python]>=1.0.8",
]
